name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release with APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f "Stronghold-Protocol.apk" ]; then
            gh release create "$TAG" Stronghold-Protocol.apk \
              --title "Stronghold Protocol $TAG" \
              --notes "### 卫戍协议：盟约 (Stronghold Protocol) - Android APK 发布

- 🎮 **在线直接游玩（网页版）**：[https://ak.rincynar.top](https://ak.rincynar.top)
- 🌐 **服务网络**：Cloudflare 全球边缘加速
- 📱 **Android 客户端**：
  - 沉浸式横屏全屏显示，消除手机浏览器导航栏与状态栏遮挡
  - Android 8.0+ 自适应图标规范 (Adaptive Icons)
  - 中英文系统自适应 (Stronghold Protocol / 卫戍协议：盟约)
  - 保持屏幕常亮、前台服务保活防掉线
  - 静态资源本地磁盘零延迟离线持久化缓存
  - 启动时自动轮询候选服务器节点，无可用节点时优雅降级为重试页" \
              || gh release upload "$TAG" Stronghold-Protocol.apk --clobber
          fi
