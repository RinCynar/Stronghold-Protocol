name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release with APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f "Stronghold-Protocol.apk" ]; then
            gh release create "$TAG" Stronghold-Protocol.apk \
              --title "Stronghold Protocol $TAG" \
              --notes "### 卫戍协议：盟约 (Stronghold Protocol) - Android APK 发布

- 🎮 **在线直接游玩（网页版）**：[https://ak.rincynar.top](https://ak.rincynar.top)
- 🌐 **服务网络**：Cloudflare 全球边缘加速
- 📱 **Android 客户端 (v1.0.8)**：
  - 🚀 嵌入独立现代浏览器内核 (GeckoView)，彻底摆脱系统自带精简/老旧 WebView 限制
  - 🔒 完整支持 Encrypted Client Hello (ECH) 与 DNS-over-HTTPS (DoH)，外层 SNI 彻底加密，直连免疫 GFW TCP RST 阻断
  - 🔄 多候选服务器节点自动轮询与毫秒级无缝故障转移
  - 🎨 内置移动端响应式布局自适应插件 (WebExtension)
  - 🎮 沉浸式横屏全屏显示，消除状态栏遮挡，保持屏幕常亮、前台服务保活防掉线
  - 🛡️ 安全合规脱敏：节点配置本地化隔离，对外仅暴露标准域名" \
              || gh release upload "$TAG" Stronghold-Protocol.apk --clobber
          fi
